alerts:
  - name: high_latency_p95
    severity: warning
    condition: 'latency_p95 > 3000ms'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-ai-ops
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: 'error_rate_pct > 2%'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-ai-ops
    runbook: docs/alerts.md#alert-2
  - name: degraded_retrieval_success
    severity: warning
    condition: 'retrieval_success_rate_pct < 90%'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-ai-ops
    runbook: docs/alerts.md#alert-3
